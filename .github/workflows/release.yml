# Builds the Windows installer when a version tag (v1.2.3) is pushed and attaches it to a DRAFT release.
# Publishing stays manual: open the draft on GitHub, check it, then press "Publish release".
# The installer is not code-signed (Windows SmartScreen shows a warning on first run).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Real Electron E2E on Windows (GIF test skips: ffmpeg is not installed on the runner).
      - run: npm run test:e2e

      - name: Keep E2E results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Attach to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no installer in release/"; exit 1; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --title "포토꾸미 $GITHUB_REF_NAME" --generate-notes
          fi
